on:
 push:
   Branch:Main

 pull:[dev]

jobs:

 name: "Terraform Plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
steps:
     name: Checkout
     uses: actions/checkout@v3
  with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

   name: terraform fmt
   
  
